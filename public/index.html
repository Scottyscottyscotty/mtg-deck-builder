<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Deck Analyzer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #999;
      font-size: 1.1em;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1em;
      color: #e0e0e0;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: transparent;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-weight: 500;
    }

    textarea, input, select {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
    }

    textarea {
      min-height: 200px;
    }

    input::placeholder, textarea::placeholder {
      color: #666;
    }

    button {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .results {
      display: none;
      white-space: pre-wrap;
      font-family: monospace;
      line-height: 1.6;
    }

    .results.active {
      display: block;
    }

    .error {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #ff6b6b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .error.active {
      display: block;
    }

    .history-list {
      list-style: none;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(5px);
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .history-item-title {
      font-weight: 600;
      color: #667eea;
    }

    .history-item-date {
      color: #999;
      font-size: 0.9em;
    }

    .history-item-info {
      color: #aaa;
      font-size: 0.9em;
    }

    .flex-row {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .flex-row > * {
      flex: 1;
    }

    @media (max-width: 768px) {
      .flex-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🃏 MTG Deck Analyzer</h1>
      <p class="subtitle">AI-powered deck analysis using Claude 4.5 & Scryfall</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('analyze')">Analyze Deck</button>
      <button class="tab" onclick="switchTab('compare')">Compare Decks</button>
      <button class="tab" onclick="switchTab('import')">Import from URL</button>
      <button class="tab" onclick="switchTab('history')">History</button>
    </div>

    <!-- Analyze Tab -->
    <div id="analyze-tab" class="tab-content active">
      <div class="card">
        <div class="form-group">
          <label for="deck-name">Deck Name (optional)</label>
          <input type="text" id="deck-name" placeholder="My Awesome Deck">
        </div>

        <div class="form-group">
          <label for="deck-list">Deck List</label>
          <textarea id="deck-list" placeholder="1 Sol Ring&#10;3 Swamp&#10;4 Lightning Bolt&#10;..."></textarea>
        </div>

        <div class="form-group">
          <label for="model">Model</label>
          <select id="model">
            <option value="sonnet">Claude Sonnet 4.5 (Faster, cheaper)</option>
            <option value="opus">Claude Opus 4.5 (Deeper analysis, more expensive)</option>
          </select>
        </div>

        <button onclick="analyzeDeck()">Analyze Deck</button>
      </div>

      <div class="error" id="analyze-error"></div>

      <div class="loading" id="analyze-loading">
        <div class="spinner"></div>
        <p>Analyzing your deck... This may take 30-60 seconds</p>
      </div>

      <div class="card results" id="analyze-results"></div>
    </div>

    <!-- Compare Tab -->
    <div id="compare-tab" class="tab-content">
      <div class="flex-row">
        <div class="card">
          <h3 style="margin-bottom: 15px;">Deck 1</h3>
          <textarea id="deck1-list" placeholder="Paste first deck..."></textarea>
        </div>

        <div class="card">
          <h3 style="margin-bottom: 15px;">Deck 2</h3>
          <textarea id="deck2-list" placeholder="Paste second deck..."></textarea>
        </div>
      </div>

      <div class="card">
        <div class="form-group">
          <label for="compare-model">Model</label>
          <select id="compare-model">
            <option value="sonnet">Claude Sonnet 4.5</option>
            <option value="opus">Claude Opus 4.5</option>
          </select>
        </div>

        <button onclick="compareDecks()">Compare Decks</button>
      </div>

      <div class="error" id="compare-error"></div>

      <div class="loading" id="compare-loading">
        <div class="spinner"></div>
        <p>Comparing decks... This may take 30-60 seconds</p>
      </div>

      <div class="card results" id="compare-results"></div>
    </div>

    <!-- Import Tab -->
    <div id="import-tab" class="tab-content">
      <div class="card">
        <div class="form-group">
          <label for="import-url">Deck URL</label>
          <input type="text" id="import-url" placeholder="https://www.moxfield.com/decks/...">
          <p style="margin-top: 10px; color: #999; font-size: 0.9em;">
            Supported: Moxfield, Archidekt, TappedOut
          </p>
        </div>

        <button onclick="importDeck()">Import Deck</button>
      </div>

      <div class="error" id="import-error"></div>

      <div class="loading" id="import-loading">
        <div class="spinner"></div>
        <p>Importing deck...</p>
      </div>

      <div class="card results" id="import-results"></div>
    </div>

    <!-- History Tab -->
    <div id="history-tab" class="tab-content">
      <div class="card">
        <h3 style="margin-bottom: 20px;">Analysis History</h3>
        <ul class="history-list" id="history-list">
          <li style="text-align: center; color: #999;">Loading...</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
